<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" font-family="Inter, -apple-system, sans-serif" font-size="15">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #eef2ff; stroke: #4338ca; stroke-width: 1.5; rx: 8; ry: 8; }
      .input { fill: #f7f7f8; stroke: #6a6a6a; stroke-width: 1.2; rx: 6; ry: 6; }
      .output { fill: #fff7ed; stroke: #b45309; stroke-width: 1.5; rx: 8; ry: 8; }
      .decoder { fill: #e0e7ff; stroke: #4338ca; stroke-width: 2; rx: 10; ry: 10; }
      .label { fill: #1a1a1a; text-anchor: middle; }
      .sublabel { fill: #6a6a6a; font-size: 12px; text-anchor: middle; font-style: italic; }
      .edge { stroke: #1a1a1a; stroke-width: 1.5; fill: none; }
      .tok-bg { fill: #ffffff; stroke: none; }
      .tok { fill: #4338ca; font-size: 13px; text-anchor: middle; font-family: 'SF Mono', SFMono-Regular, Menlo, monospace; }
    </style>
  </defs>

  <!-- Inputs (left column) -->
  <rect class="input" x="20"  y="40"  width="150" height="46"/>
  <text class="label" x="95"  y="68">images  o<tspan font-size="10" dy="4">t</tspan></text>

  <rect class="input" x="20"  y="147" width="150" height="46"/>
  <text class="label" x="95"  y="175">language  ℓ</text>

  <rect class="input" x="20"  y="254" width="150" height="46"/>
  <text class="label" x="95"  y="275">action chunk</text>
  <text x="95" y="292" font-size="12" text-anchor="middle" fill="#6a6a6a" font-family="'SF Mono', Menlo, monospace">a_{t:t+H}</text>

  <!-- Encoders -->
  <rect class="box" x="240" y="40"  width="130" height="46"/>
  <text class="label" x="305" y="68">DinoV2</text>

  <rect class="box" x="240" y="147" width="130" height="46"/>
  <text class="label" x="305" y="175">T5</text>

  <!-- Transformer decoder -->
  <rect class="decoder" x="500" y="90" width="170" height="130"/>
  <text class="label" x="585" y="150" font-weight="600">Transformer</text>
  <text class="label" x="585" y="170" font-weight="600">decoder</text>
  <text class="sublabel" x="585" y="192">(cross-attn)</text>

  <!-- HL-Gauss head -->
  <rect class="box" x="720" y="125" width="80" height="60"/>
  <text class="label" x="760" y="150" font-size="13">HL-Gauss</text>
  <text class="label" x="760" y="168" font-size="13">head</text>

  <!-- Q_phi output -->
  <rect class="output" x="720" y="250" width="80" height="46"/>
  <text class="label" x="760" y="278">Q<tspan font-size="11" dy="4">φ</tspan></text>

  <!-- ============ EDGES ============ -->
  <!-- Inputs -> encoders -->
  <path class="edge" d="M170,63  L240,63"  marker-end="url(#arrow)"/>
  <path class="edge" d="M170,170 L240,170" marker-end="url(#arrow)"/>

  <!-- DinoV2 -> decoder top -->
  <path class="edge" d="M370,63 C420,63 450,90 500,120" marker-end="url(#arrow)"/>
  <!-- T5 -> decoder middle -->
  <path class="edge" d="M370,170 C430,170 460,170 500,170" marker-end="url(#arrow)"/>
  <!-- action chunk -> decoder bottom (query tokens) -->
  <path class="edge" d="M170,277 C300,277 400,240 500,205" marker-end="url(#arrow)"/>

  <!-- Decoder -> HL-Gauss -->
  <path class="edge" d="M670,155 L720,155" marker-end="url(#arrow)"/>
  <!-- HL-Gauss -> Q_phi -->
  <path class="edge" d="M760,185 L760,250" marker-end="url(#arrow)"/>

  <!-- ============ TOKEN LABELS (offset from arrows, with white background) ============ -->
  <!-- z_vis: label sits ABOVE the DinoV2->decoder curve. Curve at x=440 is ~y=76; label at y=40 clears it. -->
  <rect class="tok-bg" x="410" y="26"  width="60" height="18"/>
  <text class="tok"    x="440" y="40">z<tspan font-size="10" dy="4">t</tspan><tspan font-size="10" dy="-8">vis</tspan></text>

  <!-- z_txt: label sits ABOVE the T5->decoder horizontal arrow at y=170. Put it at y=138. -->
  <rect class="tok-bg" x="410" y="124" width="60" height="18"/>
  <text class="tok"    x="440" y="138">z<tspan font-size="10" dy="4">t</tspan><tspan font-size="10" dy="-8">txt</tspan></text>

  <!-- query tokens: label sits BELOW the action-chunk->decoder curve. Curve at x=350 is ~y=272; label at y=310 clears it. -->
  <rect class="tok-bg" x="290" y="298" width="120" height="18"/>
  <text class="tok"    x="350" y="312">query tokens</text>
</svg>
